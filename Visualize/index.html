<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castalia Real-time Monitor</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background: #f4f7f6;
      color: #333;
    }

    h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    /* Nhãn trạng thái kết nối */
    #status {
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .connecting {
      background: #f1c40f;
      color: #333;
    }

    .connected {
      background: #2ecc71;
      color: #fff;
    }

    .disconnected {
      background: #e74c3c;
      color: #fff;
    }

    /* Khung hiển thị Log (Giống màn hình Hacker) */
    #console {
      width: 100%;
      height: 65vh;
      background: #1e1e1e;
      color: #00ff00;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      padding: 15px;
      overflow-y: auto;
      border-radius: 8px;
      box-sizing: border-box;
      border: 2px solid #2c3e50;
      white-space: pre-wrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* Nút bấm điều khiển */
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 15px;
      cursor: pointer;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #2980b9;
    }

    button.btn-test {
      background: #9b59b6;
    }

    button.btn-test:hover {
      background: #8e44ad;
    }
  </style>
</head>

<body>

  <h2>📡 Trạm Giám Sát Castalia (Real-time)</h2>
  <div id="status" class="connecting">⏳ Đang kết nối đến Trạm trung chuyển...</div>

  <div id="console"></div>

  <div class="controls">
    <button onclick="document.getElementById('console').innerHTML = ''">🧹 Xóa Log màn hình</button>
    <button class="btn-test" onclick="sendTestCommand()">🚀 Gửi lệnh Test (TraCI)</button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const consoleEl = document.getElementById("console");
    let ws;

    function connect() {
      // Kết nối tới WebSocket Server của Node.js (Port 8080)
      ws = new WebSocket("ws://localhost:8080");

      ws.onopen = () => {
        statusEl.textContent = "🟢 Đã kết nối với Node.js (Chờ dữ liệu từ Castalia...)";
        statusEl.className = "connected";
        logToConsole("=== HỆ THỐNG GIÁM SÁT ĐÃ SẴN SÀNG ===", "white");
      };

      ws.onmessage = (event) => {
        // Nhận log từ Castalia và in ra màn hình
        logToConsole(event.data);
      };

      ws.onclose = () => {
        statusEl.textContent = "🔴 Mất kết nối. Đang thử lại...";
        statusEl.className = "disconnected";
        // logToConsole("=== ĐÃ NGẮT KẾT NỐI TỚI SERVER. THỬ LẠI SAU 3 GIÂY ===", "red");
        setTimeout(connect, 3000); // Tự động reconnect
      };

      ws.onerror = (err) => {
        console.error("Lỗi WebSocket:", err);
      };
    }

    // Hàm in chữ ra khung đen và tự động cuộn
    function logToConsole(message, color = "#00ff00") {
      const span = document.createElement("span");
      span.style.color = color;
      span.textContent = message + "\n";
      consoleEl.appendChild(span);

      // Tự động cuộn xuống dòng mới nhất
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Hàm gửi lệnh ngược về Castalia qua WebSocket -> Node.js -> TCP
    function sendTestCommand() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const cmd = "SPAWN_PACKET_NODE_3"; // Lệnh thử nghiệm
        ws.send(cmd);
        logToConsole(`[Web UI] >>> Đã phát lệnh điều khiển: ${cmd}`, "#f1c40f"); // Chữ vàng
      } else {
        alert("Chưa kết nối tới server!");
      }
    }

    // Khởi động kết nối ngay khi mở trang
    connect();
  </script>
</body>

</html>
