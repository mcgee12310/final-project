[General]
include ../Parameters/Castalia.ini
sim-time-limit = 30s
debug-on-errors = true
scheduler-class = "cRealTimeScheduler"

SN.wirelessChannel.onlyStaticNodes = false
SN.wirelessChannel.sigma = 0
SN.wirelessChannel.PLExponent = 2.0

SN.node[*].MobilityManagerName = "NoMobilityManager"
SN.node[*].zCoor = 0

SN.node[*].Communication.MACProtocolName = "BpabMac"
SN.node[*].Communication.MAC.maxIterations = 4
SN.node[*].Communication.MAC.rangeR = 300
SN.node[*].Communication.MAC.widthW = 30
SN.node[*].Communication.MAC.minProgress = 10 
SN.node[*].Communication.MAC.slotDuration = 0.05
SN.node[*].Communication.MAC.maxRetries = 3

SN.node[*].Communication.Radio.RadioParametersFile = "../Parameters/Radio/CC2420.txt"
SN.node[*].Communication.Radio.TxOutputPower = "0dBm"

SN.node[*].Communication.MAC.collectTraceInfo = true
SN.node[*].Communication.Radio.collectTraceInfo = false

SN.node[*].ApplicationName = "BpabApp"
SN.node[*].Application.sendInterval = 5s

[Config Default]
SN.numNodes = 50
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000

[Config BPAB_NoRelay]
SN.numNodes = 2
SN.node[0].xCoor = 0
SN.node[0].yCoor = 0
SN.node[1].xCoor = 500
SN.node[1].yCoor = 0

[Config Multiple]
SN.numNodes = 8
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000

SN.node[*].Application.sendInterval = 20s

[Config Conflict]
SN.numNodes = 8

SN.node[0..3].xCoor = 100
SN.node[0..3].yCoor = 0

SN.node[4..7].xCoor = 200
SN.node[4..7].yCoor = 0
