[General]
include ../Parameters/Castalia.ini
sim-time-limit = 30s
debug-on-errors = true
scheduler-class = "cRealTimeScheduler"

SN.wirelessChannel.onlyStaticNodes = false
#SN.wirelessChannel.pathLossExponent = 3.0
#SN.wirelessChannel.sigma = 2

SN.node[*].MobilityManagerName = "NoMobilityManager"
SN.node[*].zCoor = 0

SN.node[*].Communication.MACProtocolName = "BpabMac"
SN.node[*].Communication.MAC.maxIterations = 6
SN.node[*].Communication.MAC.rangeR = 400
SN.node[*].Communication.MAC.widthW = 30
SN.node[*].Communication.MAC.minProgress = 20 
SN.node[*].Communication.MAC.slotDuration = 0.0005
SN.node[*].Communication.MAC.maxRetries = 5

SN.node[*].Communication.Radio.RadioParametersFile = "../Parameters/Radio/CC2420.txt"
#SN.node[*].Communication.Radio.mode = "normal"
SN.node[*].Communication.Radio.TxOutputPower = "0dBm"
#SN.node[*].Communication.Radio.receiverSensitivity = "-95dBm"
#SN.node[*].Communication.Radio.carrierSenseThreshold = "-100dBm"
SN.node[*].Communication.Radio.collisionModel = 2
#SN.node[*].Communication.Radio.carrierSenseInterruptEnabled = false

SN.node[*].Communication.MAC.collectTraceInfo = true
SN.node[*].Communication.Radio.collectTraceInfo = false

SN.node[*].ApplicationName = "BpabApp"

[Config Default]
SN.numNodes = 48
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000
SN.node[2].Application.isSender = true
SN.node[*].Application.sendInterval = 15s

[Config Multiple]
sim-time-limit = 20s
SN.numNodes = 8
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000
SN.node[0].Application.isSender = true
SN.node[*].Application.sendInterval = 15s

[Config Highway]
sim-time-limit = 25s
SN.numNodes = 500
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000
SN.node[5].Application.isSender = true
SN.node[5].Application.sendInterval = 20s
#SN.node[198].Application.isSender = true
#SN.node[198].Application.sendInterval = 7.748415375089s

[Config Intersection]
sim-time-limit = 50s
SN.numNodes = 102
SN.node[100].Communication.MAC.nodeType = 1
SN.node[101].Communication.MAC.nodeType = 1
SN.node[100].xCoor = 1000
SN.node[100].yCoor = 1100
SN.node[101].xCoor = 1300
SN.node[101].yCoor = 800
SN.node[*].xCoor = 5000
SN.node[*].yCoor = 5000
SN.node[5].Application.isSender = true
SN.node[*].Application.sendInterval = 47s
